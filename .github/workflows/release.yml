name: Xiahua DISK Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file xdg-utils binutils patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - name: Build unsigned packages
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: Xiahua-DISK-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' packages < <(find release-assets -type f -print0)
          gh release create "$RELEASE_TAG" "${packages[@]}" --title "Xiahua DISK $RELEASE_TAG" --notes-file docs/release-notes.md --verify-tag
