<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/xiahua-disk.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xiahua DISK</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #f7f9fc;
      }
      .startup-screen {
        display: grid;
        height: 100%;
        place-items: center;
        user-select: none;
      }
      .startup-content {
        display: grid;
        gap: 20px;
        justify-items: center;
        color: #202c3d;
        font:
          600 20px/1.3 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        letter-spacing: -0.025em;
      }
      .startup-mark img {
        display: block;
        width: 76px;
        height: 76px;
      }
      .startup-progress {
        width: 48px;
        height: 2px;
        background: #225fe8;
        animation: startup-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes startup-pulse {
        to {
          opacity: 0.3;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #151b24;
        }
        .startup-content {
          color: #e6edf7;
        }
        .startup-progress {
          background: #92b4ff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-progress {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-screen" data-tauri-drag-region role="status" aria-label="Xiahua DISK is starting">
        <div class="startup-content">
          <span class="startup-mark"
            ><img src="/xiahua-disk.svg" width="74" height="74" fetchpriority="high" alt=""
          /></span>
          <strong>Xiahua DISK</strong>
          <span class="startup-progress" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
